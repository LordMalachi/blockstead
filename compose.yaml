name: blockstead

services:
  blockstead:
    build:
      context: .
    image: blockstead:local
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      BLOCKSTEAD_BIND_HOST: 0.0.0.0
      BLOCKSTEAD_PORT: 8765
      BLOCKSTEAD_DATA_DIR: /var/lib/blockstead
      BLOCKSTEAD_SERVER_ROOT: /srv/minecraft
      BLOCKSTEAD_STATIC_DIR: /opt/blockstead/frontend/dist
      BLOCKSTEAD_SECURE_COOKIES: "${BLOCKSTEAD_SECURE_COOKIES:-false}"
      BLOCKSTEAD_ALLOWED_ORIGINS: "${BLOCKSTEAD_ALLOWED_ORIGINS:-http://127.0.0.1:8765,http://localhost:8765}"
      BLOCKSTEAD_DISCORD_APPLICATION_ID: "${BLOCKSTEAD_DISCORD_APPLICATION_ID:-}"
      BLOCKSTEAD_DISCORD_PUBLIC_KEY: "${BLOCKSTEAD_DISCORD_PUBLIC_KEY:-}"
      BLOCKSTEAD_DISCORD_RELAY_URL: "${BLOCKSTEAD_DISCORD_RELAY_URL:-}"
      BLOCKSTEAD_DISCORD_RELAY_INSTALLATION_ID: "${BLOCKSTEAD_DISCORD_RELAY_INSTALLATION_ID:-}"
      BLOCKSTEAD_DISCORD_RELAY_CONNECTOR_SECRET: "${BLOCKSTEAD_DISCORD_RELAY_CONNECTOR_SECRET:-}"
      BLOCKSTEAD_DISCORD_RELAY_CA_FILE: "${BLOCKSTEAD_DISCORD_RELAY_CA_FILE:-}"
      # Shown to the owner in the dashboard as "where is this on my
      # computer" next to files and folders it manages. Purely cosmetic:
      # the app never uses these to open, read, or write anything, so an
      # incorrect value here cannot break the app -- only the displayed text.
      BLOCKSTEAD_HOST_DATA_DIR_DISPLAY: "${BLOCKSTEAD_HOST_DATA_DIR:-./blockstead-data}"
      BLOCKSTEAD_HOST_SERVER_ROOT_DISPLAY: "${BLOCKSTEAD_HOST_SERVERS_DIR:-./blockstead-servers}"
    ports:
      - "${BLOCKSTEAD_DASHBOARD_BIND:-127.0.0.1}:${BLOCKSTEAD_DASHBOARD_PORT:-8765}:8765"
      - "${MINECRAFT_BIND:-0.0.0.0}:${MINECRAFT_PORT:-25565}:25565"
    volumes:
      # Real folders on this computer rather than Docker-managed volumes, so
      # Finder/Explorer/your own tools can reach them directly. See "Where
      # things live" in the Docker guide before changing these.
      - "${BLOCKSTEAD_HOST_DATA_DIR:-./blockstead-data}:/var/lib/blockstead"
      - "${BLOCKSTEAD_HOST_SERVERS_DIR:-./blockstead-servers}:/srv/minecraft"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
