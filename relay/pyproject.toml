[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "blockstead-discord-relay"
version = "0.1.0"
description = "Multi-tenant always-online Discord relay for Blockstead"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.0",
  "httpx==0.28.1",
  "pydantic-settings==2.14.2",
  "uvicorn[standard]==0.51.0",
  "websockets==16.1.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.3.0", "ruff==0.9.7", "mypy==1.15.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/discord_relay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]
